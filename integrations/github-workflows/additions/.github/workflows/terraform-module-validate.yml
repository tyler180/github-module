name: Reusable Terraform module validation
on:
  workflow_call:
    inputs:
      terraform-version:
        type: string
        required: true
      tooling-ref:
        description: Same reviewed full github-workflows SHA used for this workflow call.
        type: string
        required: true
      working-directory:
        type: string
        default: '.'
permissions:
  contents: read
jobs:
  hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
    with:
      tooling-ref: ${{ inputs.tooling-ref }}
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      GITHUB_TOKEN: ''
      GH_TOKEN: ''
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_SESSION_TOKEN: ''
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      # All delivered tests use command=plan and a mock provider.
      - run: terraform test -no-color
  gate:
    name: platform-ci
    needs: [validate, hygiene]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.validate.result }}
      HYGIENE_RESULT: ${{ needs.hygiene.result }}
    steps:
      - run: test "$RESULT" = success && test "$HYGIENE_RESULT" = success
