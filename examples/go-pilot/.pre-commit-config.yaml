repos:
  - repo: https://github.com/tyler180/github-workflows
    rev: b1a82505188fad2b6bca6c035c40b83c49bfc73f
    hooks:
      - id: repository-hygiene
      - id: secret-scan
      - id: secret-scan-setup
  - repo: local
    hooks:
      - id: go-validation
        name: Go formatting, vet and race tests
        entry: bash scripts/validate.sh
        language: system
        pass_filenames: false
        always_run: true
