name: Reusable repository policy fixtures
on:
  workflow_call:
    inputs:
      trusted-policy-ref:
        description: Full reviewed github-workflows commit containing policy tooling; promote separately from candidates.
        type: string
        required: true
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require immutable policy selection
        env:
          POLICY_REF: ${{ inputs.trusted-policy-ref }}
        run: '[[ "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: tyler180/github-workflows
          ref: ${{ inputs.trusted-policy-ref }}
          persist-credentials: false
          path: trusted-policy
      - name: Run trusted offline fixtures without candidate execution
        working-directory: trusted-policy
        run: python3 -I automation/repository-policy/test_policy.py
      - run: python3 -I trusted-policy/automation/repository-policy/test_receipt.py
      - run: python3 -I trusted-policy/automation/repository-policy/test_hygiene.py
      - name: Install checksum-pinned scanner
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/scanner"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/scanner" gitleaks
          echo "$RUNNER_TEMP/scanner" >> "$GITHUB_PATH"
      - name: Install pinned test parser
        run: python3 -m pip install -r trusted-policy/automation/repository-policy/requirements-test.txt
      - run: python3 -I trusted-policy/automation/repository-policy/test_secret_scan.py
      - run: python3 -I trusted-policy/automation/repository-policy/test_deployment_workflow.py
